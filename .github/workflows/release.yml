name: Release

# Push a tag like v0.2.0 to publish:
#   - ghcr.io/<owner>/targethub:<version> and :latest (linux/amd64 + linux/arm64, so the
#     server also runs on a Raspberry Pi 4/5 or other ARM64 host)
#   - a GitHub release with the Python SDK wheel and the VS Code extension (.vsix)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/targethub" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build SDK wheel
        run: pip wheel ./sdk/python --no-deps -w dist
      - name: Build VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run package
          mv targethub-vscode.vsix ../dist/
      - name: Agent files with checksums
        run: |
          cp backend/app/web/agent/targethub_agent.py backend/app/web/agent/install.sh backend/app/web/agent/install.ps1 dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
