[project]
name = "targethub-backend"
version = "0.2.0"
description = "TargetHub Backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "gunicorn",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "python-multipart",
    "pydantic-settings",
    "python-dotenv",
    "loguru",
    "pyserial",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "black",
    "ruff",
    "isort",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.isort]
profile = "black"


[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
markers = ["e2e: live hub + real agent process end-to-end run (slow)"]
addopts = "-m 'not e2e'"
