version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: targethub
      POSTGRES_USER: targethub
      POSTGRES_PASSWORD: changeme
    volumes:
      - targethub-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - targethub-redis:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - targethub-minio:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://targethub:changeme@postgres:5432/targethub
      SECRET_KEY: replace-me
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://targethub:changeme@postgres:5432/targethub
      SECRET_KEY: replace-me
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

volumes:
  targethub-postgres:
  targethub-redis:
  targethub-minio:
