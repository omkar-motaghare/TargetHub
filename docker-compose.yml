# TargetHub: PostgreSQL + API (the React UI is served by the API).
# Copy .env.example to .env (or run scripts/install.sh). Set COMPOSE_PROJECT_NAME and
# TARGETHUB_PORT to run several independent stacks on one host.
# TLS: add the Caddy overlay with COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml
name: ${COMPOSE_PROJECT_NAME:-targethub}

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: targethub
      POSTGRES_USER: targethub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: ${TARGETHUB_IMAGE:-targethub:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${TARGETHUB_VERSION:-0.2.0}
    restart: unless-stopped
    # Everything in .env reaches the server (e.g. TARGETHUB_DD_API_KEY or any other
    # variable a capability's api_key_env names). The keys below are always set.
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: TargetHub
      APP_VERSION: ${TARGETHUB_VERSION:-0.2.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_WORKERS: ${API_WORKERS:-2}
      DATABASE_URL: postgresql://targethub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/targethub
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY to a random 32+ character value}
      TARGETHUB_PUBLIC_URL: ${TARGETHUB_PUBLIC_URL:-http://localhost:8000}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "${TARGETHUB_BIND:-127.0.0.1}:${TARGETHUB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
