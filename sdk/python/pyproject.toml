[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "targethub-sdk"
version = "0.2.0"
description = "Python client and CLI for the TargetHub embedded lab orchestration API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]
console = ["websockets>=12"]

[project.scripts]
targethub = "targethub_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["targethub_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
